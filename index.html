<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CELESTIAL ARRAY · 星航仪</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020811;color:#c6ebff;font:14px system-ui,Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
header{position:absolute;top:0;left:0;right:0;padding:16px 22px;background:linear-gradient(#031529eb,transparent);pointer-events:none}
h1{margin:0;color:#e3f9ff;font-size:20px;letter-spacing:3px}
small{color:#6fb4d5;letter-spacing:1px}
nav{position:absolute;top:82px;left:14px;max-height:calc(100dvh - 150px);overflow:auto;display:flex;flex-direction:column;gap:5px}
button{background:#071d31cc;color:#a8dcf7;border:1px solid #285676;border-radius:4px;padding:9px 13px;text-align:left;cursor:pointer;backdrop-filter:blur(5px)}
button:active,button:hover,.on{color:#fff;border-color:#7bdef9;background:#12415a}
aside{position:absolute;right:14px;top:80px;display:flex;gap:6px;flex-direction:column}
footer{position:absolute;bottom:14px;left:16px;right:16px;color:#82a9c2;display:flex;justify-content:space-between;gap:16px;pointer-events:none}
#info{position:absolute;bottom:55px;right:16px;width:min(320px,56vw);padding:13px;background:#03172bdc;border-left:2px solid #48bafa;line-height:1.7}
#regions{display:none;position:absolute;inset:22% 10% 18% 28%;padding:18px;background:#031629e8;border:1px solid #417da0;overflow:auto}
#regions button{margin:5px}
#regions h2{margin:0 0 12px;font-size:18px}
@media(max-width:600px){
nav{top:74px;left:8px;max-width:110px}
nav button{font-size:12px;padding:7px}
aside{right:8px}
#info{bottom:55px;font-size:12px}
#regions{inset:19% 8% 14% 24%}
footer{font-size:10px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<header>
<h1>CELESTIAL ARRAY</h1>
<small id="sub">星航仪 · 太阳系导航 / SOLAR SYSTEM</small>
</header>
<nav id="nav"></nav>
<aside>
<button id="back">⌂ 太阳系</button>
<button id="zoomIn">＋</button>
<button id="zoomOut">－</button>
<button id="lang">EN / 中文</button>
<button id="explore">地球区域</button>
</aside>
<section id="info"></section>
<section id="regions">
<h2 id="regionTitle">地球区域 / EARTH REGIONS</h2>
<div id="regionButtons"></div>
<p id="regionInfo"></p>
<button id="close">返回地球 / BACK</button>
</section>
<footer>
<span id="hint">点击星球 · 拖动旋转 · 双指缩放</span>
<span>PROTOTYPE 0.3</span>
</footer>
<script>
const c=document.querySelector('#sky'),g=c.getContext('2d');
let w,h,dpr,zoom=1,pan=0,spin=0,mode='solar',chosen=3,en=false,last=0,drag=false,downX=0,downY=0,moved=false;
const $=s=>document.querySelector(s);
const names=[['太阳','SUN'],['水星','MERCURY'],['金星','VENUS'],['地球','EARTH'],['火星','MARS'],['木星','JUPITER'],['土星','SATURN'],['天王星','URANUS'],['海王星','NEPTUNE'],['月球','MOON']];
const color=['#ffba40','#acb6bc','#debf8e','#2679c5','#b55c38','#cda47b','#e0c18b','#8dd8e4','#456fe0','#9ba5aa'];
let pos=[];
const stars=Array.from({length:240},(_,i)=>({x:(i*97.13%101)/101,y:(i*73.57%103)/103,a:.25+(i%7)/10,r:i%11===0?1.6:.65}));
function size(){
dpr=Math.min(devicePixelRatio||1,2);
w=innerWidth;h=innerHeight;
c.width=w*dpr;c.height=h*dpr;
g.setTransform(dpr,0,0,dpr,0,0)
}
addEventListener('resize',size);
size();
function circle(x,y,r,col,shade=true){
g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();
let z=g.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.25);
z.addColorStop(0,'#e6f8ff');z.addColorStop(.12,col);
z.addColorStop(.8,col);z.addColorStop(1,'#03101e');
g.fillStyle=z;g.fillRect(x-r,y-r,2*r,2*r);
if(shade){
let sh=g.createLinearGradient(x-r,y,x+r,y);
sh.addColorStop(0,'#000a');sh.addColorStop(.4,'#0000');
sh.addColorStop(1,'#000b');
g.fillStyle=sh;g.fillRect(x-r,y-r,2*r,2*r)
}
g.restore();
g.strokeStyle='#8cdeff55';g.lineWidth=.7;
g.beginPath();g.arc(x,y,r,0,7);g.stroke()
}
function planet(i,x,y,r){
g.save();
if(i===0){
g.shadowColor='#fa842a';g.shadowBlur=r*.85;
circle(x,y,r,'#fba738',false)
}else{
circle(x,y,r,color[i]);
if(i===3){
g.save();g.beginPath();g.arc(x,y,r*.97,0,7);g.clip();
g.fillStyle='#34ad8455';
for(let j=0;j<9;j++){
let a=j*2.3+spin*.7;
let px=x+Math.sin(a)*r*.65,py=y+Math.cos(j*3.1)*r*.6;
g.beginPath();
g.ellipse(px,py,r*(.12+j%3*.045),r*(.07+j%4*.04),a,0,7);
g.fill()
}
g.strokeStyle='#c8f8ff50';
for(let j=0;j<7;j++){
let yy=y+(j-3)*r*.21;
g.beginPath();
g.ellipse(x+Math.sin(spin+j)*r*.12,yy,r*.65,r*.06,spin*.2,0,7);
g.stroke()
}
g.restore()
}else if([5,6,7].includes(i)){
g.save();g.beginPath();g.arc(x,y,r*.96,0,7);g.clip();
for(let j=0;j<7;j++){
g.strokeStyle=j%2?'#fff4':'#35281899';
g.lineWidth=r*.08;
g.beginPath();
g.moveTo(x-r,y-r*.7+j*r*.23);
g.lineTo(x+r,y-r*.45+j*r*.23);
g.stroke()
}
g.restore()
}
if(i===6){
g.strokeStyle='#e8d3a6a0';
g.lineWidth=Math.max(2,r*.1);
g.beginPath();
g.ellipse(x,y,r*1.6,r*.4,-.3,0,7);
g.stroke()
}
}
g.restore()
}
function background(t){
g.fillStyle='#020813';g.fillRect(0,0,w,h);
const b=g.createRadialGradient(w*.58,h*.48,5,w*.58,h*.48,w*.7);
b.addColorStop(0,'#103454');b.addColorStop(1,'#01050d');
g.fillStyle=b;g.fillRect(0,0,w,h);
for(const s of stars){
g.fillStyle=`rgba(182,224,255,${s.a*(.8+.2*Math.sin(t+s.x*10))})`;
g.fillRect(s.x*w,s.y*h,s.r,s.r)
}
}
function frame(ms){
let t=ms/1000;background(t);pos=[];
if(mode==='solar'){
let cx=w*.56+pan,cy=h*.52,R=Math.max(14,Math.min(w*.38,h*.38)/8);
g.save();g.translate(cx,cy);g.scale(zoom,zoom);
for(let i=1;i<=8;i++){
g.strokeStyle='#3b89ad48';g.lineWidth=1/zoom;
g.beginPath();g.ellipse(0,0,R*i,R*i*.68,0,0,7);g.stroke()
}
planet(0,0,0,Math.max(18,R*.8));
pos[0]={x:cx,y:cy,r:26};
for(let i=1;i<=8;i++){
let a=t*(.11/i)+i*1.7,px=Math.cos(a)*R*i,py=Math.sin(a)*R*i*.68;
let rad=[0,4,7,8,6,16,13,11,10][i];
planet(i,px,py,rad);
pos[i]={x:cx+px*zoom,y:cy+py*zoom,r:Math.max(18,rad*zoom+5)};
g.fillStyle='#9dc9e6';g.font='11px system-ui';
g.fillText(en?names[i][1]:names[i][0],px+rad+5,py-5)
}
g.restore()
}else{
let x=w*.58,y=h*.52,r=Math.min(w*.29,h*.32)*zoom;
planet(chosen,x,y,r);
if(chosen===3){
g.strokeStyle='#4dcfff33';
for(let j=1;j<=3;j++){
g.beginPath();
g.ellipse(x,y,r*1.16,r*(.45+j*.15),spin*.1,0,7);
g.stroke()
}
}
}
requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
function nav(){
let n=$('#nav');n.innerHTML='';
names.forEach((v,i)=>{
let b=document.createElement('button');
b.textContent=(i===3?'◎ ':'◦ ')+(en?v[1]:v[0]);
b.className=(mode!=='solar'&&chosen===i)?'on':'';
b.onclick=()=>select(i);n.append(b)
});
$('#back').textContent=en?'⌂ SOLAR SYSTEM':'⌂ 太阳系';
$('#explore').textContent=en?'EARTH REGIONS':'地球区域';
$('#close').textContent=en?'BACK TO EARTH':'返回地球';
$('#hint').textContent=en?'Tap planet · Drag rotate · Pinch zoom':'点击星球 · 拖动旋转 · 双指缩放';
$('#sub').textContent=en?'SOLAR SYSTEM NAVIGATION':'星航仪 · 太阳系导航 / SOLAR SYSTEM';
info()
}
function info(){
let v=names[chosen];
$('#info').innerHTML=mode==='solar'?(en?'SOLAR SYSTEM<br>Select a planet to approach.':'太阳系总览<br>选择星球进入近景。'):`<b>${en?v[1]:v[0]} / ${v[1]}</b><br>${en?'Drag to rotate the view. Use + / − to zoom.':'拖动画面可旋转视角，使用＋／－缩放。'}${chosen===3?'<br>'+(en?'Select EARTH REGIONS to explore.':'点击“地球区域”继续探索。'):''}`;
$('#explore').style.display=(mode==='planet'&&chosen===3)?'block':'none'
}
function select(i){
chosen=i;mode='planet';zoom=1;spin=0;
$('#regions').style.display='none';nav()
}
$('#back').onclick=()=>{
mode='solar';zoom=1;pan=0;
$('#regions').style.display='none';nav()
};
$('#zoomIn').onclick=()=>zoom=Math.min(2.4,zoom*1.25);
$('#zoomOut').onclick=()=>zoom=Math.max(.55,zoom/1.25);
$('#lang').onclick=()=>{
en=!en;nav();if(mode==='regions')regions()
};
function regions(){
mode='regions';$('#regions').style.display='block';
$('#regionTitle').textContent=en?'EARTH REGIONS':'地球区域 / EARTH REGIONS';
let a=[['亚洲','ASIA'],['欧洲','EUROPE'],['非洲','AFRICA'],['北美洲','NORTH AMERICA'],['南美洲','SOUTH AMERICA'],['大洋洲','OCEANIA'],['南极洲','ANTARCTICA']];
$('#regionButtons').innerHTML='';
a.forEach(v=>{
let b=document.createElement('button');
b.textContent=en?v[1]:v[0];
b.onclick=()=>$('#regionInfo').textContent=(en?v[1]:v[0])+(en?' · Detailed map in a future version.':' · 后续版本将加入详细地图。');
$('#regionButtons').append(b)
});
$('#regionInfo').textContent=en?'Choose a region.':'请选择区域。'
}
$('#explore').onclick=regions;
$('#close').onclick=()=>{
$('#regions').style.display='none';mode='planet';info()
};
let pointers=new Map(),pinch=0;
c.addEventListener('pointerdown',e=>{
c.setPointerCapture(e.pointerId);
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
drag=true;downX=e.clientX;downY=e.clientY;moved=false
});
c.addEventListener('pointermove',e=>{
if(!pointers.has(e.pointerId))return;
let p=pointers.get(e.pointerId);
if(pointers.size===1){
let dx=e.clientX-p.x;
if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>8)moved=true;
if(mode==='solar')pan+=dx;else spin+=dx*.025
}else if(pointers.size===2){
let q=[...pointers.values()].find(v=>v!==p);
let dist=Math.hypot(e.clientX-q.x,e.clientY-q.y);
if(pinch)zoom=Math.max(.55,Math.min(2.4,zoom*dist/pinch));
pinch=dist;moved=true
}
p.x=e.clientX;p.y=e.clientY
});
c.addEventListener('pointerup',e=>{
if(!moved&&mode==='solar'){
let hit=pos.findIndex(p=>p&&Math.hypot(p.x-e.clientX,p.y-e.clientY)<p.r);
if(hit>=0)select(hit)
}
pointers.delete(e.pointerId);
if(pointers.size<2)pinch=0;
drag=false
});
c.addEventListener('wheel',e=>{
e.preventDefault();
zoom=Math.max(.55,Math.min(2.4,zoom*(e.deltaY>0?.9:1.1)))
},{passive:false});
nav();
</script>
</body>
</html>
