for(var j=1;j<=8;j++){var rr=unit*(j+.6);ellipse(cx,cy,rr,rr*.58,-.23,0,7,'rgba(56,161,233,'+(.21-j*.008)+')',1)}ball(0,cx,cy,Math.max(16,unit*.87),t*.01);points=[{i:0,x:cx,y:cy,r:30}];
for(var i=1;i<=8;i++){var a=i*2.4+t*.11/(i*.5+1),r=unit*(i+.6),dx=Math.cos(a)*r,dy=Math.sin(a)*r*.58,x=cx+dx*Math.cos(-.23)-dy*Math.sin(-.23),y=cy+dx*Math.sin(-.23)+dy*Math.cos(-.23),br=[0,4.4,6.6,7.5,5.1,14,12,8.2,8][i]*Math.max(.85,Math.min(1.25,W/1000));ball(i,x,y,br,t*.035);points.push({i:i,x:x,y:y,r:Math.max(23,br+12)});
if(i>=3&&(W>600||i===3)){g.fillStyle=i===3?'#d2f1ff':'#9bbdce';g.font='11px Arial';g.fillText(planets[i][1],x+br+8,y-br-4)}
if(i===3)ball(9,x+Math.cos(t*.28)*19,y+Math.sin(t*.28)*11,3,t*.1)}g.fillStyle='#8fc1df';g.textAlign='center';g.font='12px Arial';g.fillText('SOLAR SYSTEM  //  SELECT DESTINATION',cx,H*.77);g.textAlign='left'}
function focus(t){var mobile=W<560,x=W*(mobile?.62:view==='array'?.51:.50),y=H*(mobile?.43:.49),b=Math.min(W*(mobile?.32:.25),H*(mobile?.29:.32)),r=b*(view==='array'?.85:1.15)*scale;if(view==='regions'){x=W*(mobile?.65:.54)}r=Math.max(25,r);reticle(x,y,r,t);ball(chosen,x,y,r,angle);
if(chosen===3){var ma=t*.15,xx=x+Math.cos(.3+ma)*r*1.5,yy=y-Math.sin(.3+ma)*r*.7;ball(9,xx,yy,Math.max(5,r*.18),t*.05);g.fillStyle='#b5e1fb';g.font='10px Arial';g.fillText('MOON',xx+r*.18+8,yy);
if(view==='regions'){var q=areas[region],lon=q[2]*PI/180+angle,lat=q[3]*PI/180,visible=Math.cos(lat)*Math.cos(lon),mx=x+Math.sin(lon)*Math.cos(lat)*r,my=y-Math.sin(lat)*r;if(visible>0){ellipse(mx,my,8+Math.sin(t*2)*2,8+Math.sin(t*2)*2,0,0,7,'#5ee0ffed',1.5);stroke(mx+12,my-10,mx+40,my-35,'#67d9ff9c');g.font='12px Arial';g.fillStyle='#d0f6ff';g.fillText(q[1],mx+44,my-37)}}}
g.font='10px Arial';g.fillStyle='#82b4d0';g.fillText('HOLOGRAPHIC PROJECTION  //  '+planets[chosen][1],x-r*1.25,y+r*1.68)}
var lastFrame=0;function frame(ms){if(ms-lastFrame<32){requestAnimationFrame(frame);return}lastFrame=ms;var t=ms/1000;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);g.drawImage(bg,0,0,W,H);light(W*.58,H*.19,Math.min(W,H)*.28,'27,112,221',.14);stroke(W*.31,H*.27,W*.86,H*.19,'#4ebeff12',2);if(view==='system')solar(t);else focus(t);requestAnimationFrame(frame)}
function row(label,val){return '<div class="stat"><span>'+label+'</span><strong>'+val+'</strong></div>'}
function renderDetail(){var p=planets[chosen],h='';if(view==='system'){
h='<div class="section-title">PRIMARY STAR SYSTEM</div><h2>太阳系</h2><div class="en">SOL SYSTEM</div>'+row('恒星','太阳')+row('行星','8')+row('系统','轨道总览')+'<p class="description">点击轨道上的星球选择目标，或进入星航阵列进行逐级导航。</p><button class="action" id="enter">进入星航阵列　→</button>';
}else if(view==='regions'){var z=areas[region];h='<div class="section-title">GEOGRAPHIC TARGET</div><h2>'+z[0]+'</h2><div class="en">'+z[1]+'</div>'+row('目标','地球 / '+z[1])+row('参考经度',z[2]+'°')+'<p class="description">'+z[4]+'。目前属于区域概览，不是精确 GIS 地图。</p><button class="action secondary" id="toPlanet">返回地球近景</button>';
}else{h='<div class="section-title">DESTINATION DATA</div><h2>'+p[0]+'</h2><div class="en">'+p[1]+'</div>'+row('平均半径',p[4]+' km')+row('距日距离',p[5]+(chosen===9?'':' AU'))+row('轨道周期',p[6])+row('参考温度',p[7])+'<p class="description">'+p[8]+'</p>';
if(view==='array')h+='<button class="action" id="approach">进入行星近景　→</button>';else if(chosen===3)h+='<button class="action" id="toRegions">地球区域导航　→</button>';
h+='<button class="action secondary" id="up">'+(view==='array'?'返回太阳系':'返回星航阵列')+'</button>'}
$('#detail').innerHTML=h;function bind(id,fn){var a=$('#'+id);if(a)a.onclick=fn}bind('enter',function(){select(3,'array')});bind('approach',function(){setView('planet')});bind('toRegions',function(){region=0;angle=-areas[0][2]*PI/180;setView('regions')});bind('toPlanet',function(){setView('planet')});bind('up',function(){setView(view==='array'?'system':'array')})}
function nav(){var n=$('#nav'),h='<div class="nav-title">SELECT DESTINATION</div>';planets.forEach(function(p,i){h+='<button class="nav-item'+(chosen===i?' selected':'')+'" data-i="'+i+'"><span class="num">'+('0'+(i+1)).slice(-2)+'</span><span>'+p[0]+'<small>'+p[1]+'</small></span></button>'});n.innerHTML=h;n.classList.toggle('on',view==='array'||view==='planet');n.querySelectorAll('button').forEach(function(b){b.onclick=function(){select(+b.dataset.i,'array')}})}
function regionNav(){var n=$('#regions'),h='<div class="nav-title">SELECT REGION</div>';areas.forEach(function(a,i){h+='<button class="region-btn'+(region===i?' selected':'')+'" data-r="'+i+'">'+a[0]+'<small>'+a[1]+'</small></button>'});n.innerHTML=h;n.classList.toggle('on',view==='regions');n.querySelectorAll('button').forEach(function(b){b.onclick=function(){region=+b.dataset.r;angle=-areas[region][2]*PI/180;regionNav();renderDetail()}})}
function crumb(){var parts=[['太阳系','system'],['星航阵列','array'],['行星近景','planet'],['地球区域','regions']],max={system:0,array:1,planet:2,regions:3}[view],h='';for(var i=0;i<=max;i++){if(i)h+='<span class="sep">◇</span>';h+='<button class="crumb'+(i===max?' active':'')+'" data-go="'+parts[i][1]+'">'+parts[i][0]+'</button>'}$('#crumbs').innerHTML=h;$('#crumbs').querySelectorAll('button').forEach(function(b){b.onclick=function(){if(b.dataset.go==='regions')chosen=3;setView(b.dataset.go)}})}
function refresh(){nav();regionNav();crumb();renderDetail();$('#status').innerHTML='STELLAR MATRIX <b>ONLINE</b><br>VIEW / '+view.toUpperCase()+' · '+planets[chosen][1]}
function setView(v){view=v;scale=1;refresh()}function select(i,v){chosen=i;angle=.25;setView(v||'array')}
function hit(x,y){if(view==='system'){for(var i=points.length-1;i>=0;i--){var p=points[i];if(Math.hypot(x-p.x,y-p.y)<p.r){select(p.i,'array');return}}}
else if(view==='array'){setView('planet')}
else if(view==='planet'&&chosen===3){region=0;angle=-areas[0][2]*PI/180;setView('regions')}}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});down.x=e.clientX;down.y=e.clientY;moved=false});
cv.addEventListener('pointermove',function(e){if(!touch.has(e.pointerId))return;var p=touch.get(e.pointerId),dx=e.clientX-p.x;if(touch.size===1){if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>7)moved=true;if(view!=='system')angle+=dx*.004}else{var a=[...touch].find(function(q){return q[0]!==e.pointerId});if(a){var dist=Math.hypot(a[1].x-e.clientX,a[1].y-e.clientY);if(pinch)scale=Math.min(2.5,Math.max(.55,scale*dist/pinch));pinch=dist;moved=true}}p.x=e.clientX;p.y=e.clientY});
cv.addEventListener('pointerup',function(e){if(!moved)hit(e.clientX,e.clientY);touch.delete(e.pointerId);if(touch.size<2)pinch=0});cv.addEventListener('pointercancel',function(e){touch.delete(e.pointerId);pinch=0});
cv.addEventListener('wheel',function(e){e.preventDefault();scale=Math.max(.55,Math.min(2.5,scale*(e.deltaY>0?.9:1.1)))},{passive:false});
$('#home').onclick=function(){setView('system')};$('#back').onclick=function(){setView(view==='regions'?'planet':view==='planet'?'array':'system')};$('#zoomin').onclick=function(){scale=Math.min(2.5,scale*1.2)};$('#zoomout').onclick=function(){scale=Math.max(.55,scale*.82)};
window.addEventListener('resize',resize);window.addEventListener('keydown',function(e){if(e.key==='Escape')$('#back').click()});resize();refresh();requestAnimationFrame(frame);
})();
</script></body></html>
